[package]
name = "bipoteca-plaits"
version = "0.1.0"
edition = "2024"
description = "Plaits polifônico para a Bipoteca (WebAssembly, AudioWorklet)"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Port em Rust do DSP do Mutable Instruments Plaits (MIT), fixado num commit.
mi-plaits-dsp = { git = "https://github.com/sourcebox/mi-plaits-dsp-rs", rev = "effe9864bb67d23aaf5724722ac1ce165d4e7c9f" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
